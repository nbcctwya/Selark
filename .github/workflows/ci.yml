name: Tests and code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Code checks
        run: |
          ruff check .
          ruff format --check .
      - name: Isolated regressions including Coding Plan safety (no provider keys)
        run: pytest -q
      - name: Installed CLI outside repository
        working-directory: ${{ runner.temp }}
        run: |
          selark --help
          selark plans --help
          selark ask --help
          selark ask --help | grep -- '--interactive'
          selark plans set --help | grep -- 'personal_interactive'
      - name: Local TCP and process recovery (fake upstream only)
        if: matrix.python == '3.12'
        shell: bash
        run: python scripts/verify_stability.py | tee "$RUNNER_TEMP/selark-stability.log"
      - name: API concurrency and recovery (fake upstream only)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python scripts/verify_api_stress.py --selark "$(command -v selark)" --output "$RUNNER_TEMP/selark-api-stress.json" | tee "$RUNNER_TEMP/selark-api-stress.log"
      - name: Four-resource mixed concurrency (fake upstream only, ten cycles)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python scripts/verify_resource_matrix.py --selark "$(command -v selark)" --cycles 10 --output "$RUNNER_TEMP/selark-resource-matrix.json" | tee "$RUNNER_TEMP/selark-resource-matrix.log"
      - name: Preserve isolated socket diagnostics
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selark-socket-diagnostics
          path: ${{ runner.temp }}/selark-*.json
          if-no-files-found: ignore
          retention-days: 7
