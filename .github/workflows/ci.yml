name: Tests and code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Code checks
        run: |
          ruff check .
          ruff format --check .
      - name: Isolated regression tests
        run: pytest -q
      - name: Installed CLI outside repository
        working-directory: ${{ runner.temp }}
        run: selark --help
      - name: Local TCP and process recovery (fake upstream only)
        if: matrix.python == '3.12'
        run: |
          python scripts/verify_stability.py
          python scripts/verify_api_stress.py --selark "$(command -v selark)" --output "$RUNNER_TEMP/api-stress.json"
