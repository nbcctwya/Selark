name: Tests and code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install locked dependencies and wheel
        run: |
          python -m pip install -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir reports/wheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps (Get-Item reports/wheels/selark-*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Code and repository checks
        run: |
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_repository_security.py
      - name: Native filesystem, process and shared business regressions
        run: python -m pytest -q --basetemp=reports/pytest --junitxml=reports/windows-unit.xml
      - name: Installed CLI outside repository
        working-directory: ${{ runner.temp }}
        run: |
          selark --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          selark --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          selark service --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          selark dashboard --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          selark backup drill --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import selark; print(selark.__file__)"
      - name: Native TCP, graceful shutdown and interrupted stream recovery
        run: python scripts/verify_stability.py --selark (Get-Command selark).Source --output reports/windows-stability.json
      - name: Background lifecycle, online backup and 20k-row history
        run: python scripts/verify_operations.py --selark (Get-Command selark).Source --output reports/windows-operations.json
      - name: Zero-extra-generation and idle invariants
        run: python -m scripts.measure_runtime --check-invariants --idle-seconds 2 --requests 10 --output reports/windows-idle.json
      - name: Native relay budget sample (informational)
        if: matrix.python == '3.14'
        continue-on-error: true
        run: python -m scripts.measure_relay --samples 100 --idle-seconds 10 --output reports/windows-relay.json
      - name: Preserve synthetic Windows evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selark-windows-${{ matrix.python }}
          path: |
            reports/windows-*.json
            reports/windows-*.xml
          if-no-files-found: ignore
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run setup:api
      - run: npm run check:api
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Packaged Dashboard matches the pinned frontend
        run: python ../scripts/build_dashboard.py --check --skip-build
      - name: Preserve frontend browser diagnostics (synthetic fixtures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selark-frontend-browser
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Code checks
        run: |
          ruff check .
          ruff format --check .
      - name: Reject credential literals and tracked private files
        run: python scripts/check_repository_security.py
      - name: Isolated API, Token Plan and retired-provider regressions (no real credentials)
        run: pytest -q
      - name: Installed CLI outside repository
        working-directory: ${{ runner.temp }}
        run: |
          selark --help
          selark --version
          selark status --help
          selark dashboard --help
          selark dashboard --help | grep -- '--read-only'
          selark connection add --help
          selark connection add --help | grep -- '--no-discover'
          selark model list --help
          selark model enable --help | grep -- '--all-discovered'
          selark model disable --help | grep -- '--all'
          selark model default --help | grep -- '--clear'
          selark model verify --help | grep -- '--stream'
          selark service --help
          selark logs --help
          selark backup drill --help
          selark plans --help
          selark ask --help
          selark ask --help | grep -- '--interactive'
          selark plans set --help | grep -- 'personal_interactive'
      - name: Zero-extra-generation and idle invariants
        if: matrix.python == '3.12'
        run: |
          python -m scripts.measure_runtime --check-invariants --idle-seconds 2 --requests 10 --output "$RUNNER_TEMP/selark-idle-invariants.json"
      - name: Measure relay budgets (informational shared-runner sample)
        if: matrix.python == '3.12'
        continue-on-error: true
        run: |
          python -m scripts.measure_relay --samples 100 --idle-seconds 10 --output "$RUNNER_TEMP/selark-relay-budget.json"
        # Sampling failures stay explicit in JSON; reference-host acceptance uses --check-budget.
      - name: Installed model discovery, explicit approval and read-only Dashboard (fake upstream only)
        if: matrix.python != '3.12'
        run: |
          python scripts/verify_dashboard.py --selark "$(command -v selark)" --output "$RUNNER_TEMP/selark-dashboard.json"
          python scripts/verify_dashboard_controls.py --selark "$(command -v selark)" --output "$RUNNER_TEMP/selark-dashboard-controls.json"
      - name: Dashboard Chromium acceptance (temporary synthetic ledger only)
        if: matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-dashboard.lock
          python -m playwright install --with-deps chromium
          python scripts/verify_dashboard.py --selark "$(command -v selark)" --browser-output "$RUNNER_TEMP/selark-dashboard-screenshots" --output "$RUNNER_TEMP/selark-dashboard-browser.json"
          python scripts/verify_dashboard_controls.py --selark "$(command -v selark)" --browser-output "$RUNNER_TEMP/selark-dashboard-screenshots" --output "$RUNNER_TEMP/selark-dashboard-controls-browser.json"
      - name: Local TCP and process recovery (fake upstream only)
        if: matrix.python == '3.12'
        shell: bash
        run: python scripts/verify_stability.py | tee "$RUNNER_TEMP/selark-stability.log"
      - name: API concurrency and recovery (fake upstream only)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python scripts/verify_api_stress.py --selark "$(command -v selark)" --output "$RUNNER_TEMP/selark-api-stress.json" | tee "$RUNNER_TEMP/selark-api-stress.log"
      - name: Four-resource mixed concurrency (fake upstream only, ten cycles)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python scripts/verify_resource_matrix.py --selark "$(command -v selark)" --cycles 10 --output "$RUNNER_TEMP/selark-resource-matrix.json" | tee "$RUNNER_TEMP/selark-resource-matrix.log"
      - name: Six independent applications, quotas and shared ingress (fake upstream only)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python scripts/verify_multi_app.py --requests-per-app 100 --output "$RUNNER_TEMP/selark-multi-app.json" | tee "$RUNNER_TEMP/selark-multi-app.log"
      - name: Four APIs, eight applications and 128-client bursts (fake upstream only)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python scripts/verify_multi_app.py --four-api --requests-per-app 100 --burst-clients 128 --burst-cycles 3 --output "$RUNNER_TEMP/selark-four-api.json" | tee "$RUNNER_TEMP/selark-four-api.log"
      - name: Background service, backup drill and 20k-row overview (fake upstream only)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python scripts/verify_operations.py --selark "$(command -v selark)" --output "$RUNNER_TEMP/selark-operations.json" | tee "$RUNNER_TEMP/selark-operations.log"
      - name: Preserve isolated socket diagnostics
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selark-socket-diagnostics
          path: ${{ runner.temp }}/selark-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve Dashboard browser screenshots (synthetic fixtures)
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selark-dashboard-screenshots
          path: ${{ runner.temp }}/selark-dashboard-screenshots
          if-no-files-found: ignore
          retention-days: 7
